spec_version: "0.1.0"
name: git-promptshield
version: 1.0.0
description: "Autonomous LLM Prompt Injection, Jailbreak Defense & Data Exfiltration Sentry"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - owasp-llm-defense
  - token-sanitization

tools:
  - injection-pattern-scanner
  - jailbreak-heuristic-analyzer
  - secret-leak-detector

runtime:
  max_turns: 50
  timeout: 120

tags:
  - cybersecurity
  - prompt-injection
  - jailbreak-defense
  - llm-security
  - passport-challenge

metadata:
  passport_id: "aps-promptshield-01"
  passport_category: "Cybersecurity"
