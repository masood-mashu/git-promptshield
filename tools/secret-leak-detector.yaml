name: secret-leak-detector
version: 1.0.0
description: "Scans strings for high-entropy API tokens, private keys, and credential strings"
input_schema:
  type: object
  properties:
    text_content:
      type: string
      description: "Output text or prompt to scan for secrets"
  required:
    - text_content
implementation:
  type: script
  path: secret_leak_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
